name: CI

on:
  push:
    branches:
      - main
      # The release branch. Production is deployed from
      # phase-3-vehicle-compatibility, so a change landing there must be
      # validated by the same four gates before it can be treated as a release,
      # rather than only when it eventually merges into main.
      - phase-3-vehicle-compatibility
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
